<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e141b">
<title>KwizzyGeo — the geographical quiz</title>
<!-- CRAZYGAMES: their SDK, from their CDN, as their docs prescribe. `defer`, so a slow
     or blocked CDN can never hold up the first pixel: crazy.js waits for it and the
     game plays exactly the same without it. Outside their domains the SDK reports the
     `disabled` environment and crazy.js does not talk to it at all. -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" defer></script>
<link rel="stylesheet" href="flags.css?v=2328082092">
<link rel="stylesheet" href="style.css?v=3712868752">
<link rel="stylesheet" href="quiz.css?v=3153675218">
</head>
<body>
<!-- THE MAP. Its bloom is composited INSIDE the same canvas (see paintGlow in app.js):
     a small, blurred, squared copy of the picture drawn back over it with `screen`. -->
<div id="stage"><canvas id="map"></canvas></div>
<!-- and a second, static layer: the atmosphere. Soft accent halos over the picture,
     so the world reads as lit from above the horizon rather than evenly -->
<div id="bloom" class="bloom" aria-hidden="true"></div>
<!-- the scrim closes the menu on a tap anywhere outside it: on a phone there is
     no Esc key and no guaranteed click outside the panel -->
<div id="scrim"></div>
<!-- Fullscreen: top-left, above every screen, exactly like the burger on the other
     corner. Corners drawn in SVG so no glyph can be missing from a font. -->
<button id="fsbtn" class="fsbtn" aria-label="Fullscreen">
  <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
    <path d="M3 9V3H9 M15 3H21V9 M21 15V21H15 M9 21H3V15" fill="none"
          stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
  </svg>
</button>
<!-- THE THIRD DISC. Fullscreen, Back, burger: the app's three fixed controls, all in
     the markup for the same reason - `position: fixed` only means "against the
     viewport" when no ancestor is transformed, and #quiz animates a transform on every
     screen change. A Back button inside the page drifted with that animation and sat a
     fraction of a pixel off the other two. -->
<button id="qback" class="backbtn" aria-label="Back" hidden>
  <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
    <path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor"
          stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
<div id="menu" class="menu"><div id="burger" class="burger" role="button" tabindex="0" aria-label="Pick a view">&#9776;</div><!-- the name of the active view: INSIDE the sheet, never on the closed button -     the corner is a 36 px disc, as in Kwizzy, and a tag beside it made it 160 px     wide, which on a phone ate the whole top right --><div id="mview" class="mview"></div><div id="items" class="items"></div></div>
<div id="panel" class="panel"></div>
<!-- right-click / long-press menu for the geographic point under the cursor -->
<div id="spot" class="spot"></div>
<div id="hud" class="hud"></div>
<div id="help" class="help"></div>
<!-- the quiz's three screens (start / question / score) are rendered into this one
     container by quiz.js: the markup lives there, in one place, next to the flow -->
<div id="quiz"></div>
<!-- the sound & music drawer. A SIBLING of #quiz on purpose: re-rendering a screen
     replaces #quiz's markup wholesale, and a toggle pressed mid-game must not vanish
     with it -->
<div id="qz-sound" class="qz-sound"></div>
<!-- the stats sheet: the record of everything played (stats.js, localStorage). Also a
     sibling of #quiz, for the same reason -->
<div id="qz-stats" class="qz-stats"></div>
<!-- the particle bursts (juice.js). Decorative and empty: each spark removes itself -->
<div id="burst" class="burst" aria-hidden="true"></div>
<!-- FIRST, and before app.js: it answers "is this CrazyGames?" for the fullscreen disc
     and puts the `cg` class on the body that the stylesheets hang the layout on -->
<script src="crazy.js?v=3222701650"></script>
<script src="core.js?v=99447927"></script>
<script src="app.js?v=1473904568"></script>
<script src="quizcore.js?v=2867722172"></script>
<!-- the music rules, a plain <script> AND require()d by tests/playlist_test.js: one
     source, so what a player hears is what the test checks -->
<script src="media/music/playlist.js?v=1900544426"></script>
<script src="juice.js?v=263926670"></script>
<script src="stats.js?v=3751590820"></script>
<!-- the quiz's UI strings in the map's 18 languages: one table, keyed by the same codes
     the burger's language chips use -->
<script src="i18n.js?v=1661098810"></script>
<script src="quiz.js?v=3534506076"></script>
<!-- SELF-HEAL AGAINST A STALE index.html.
     The cache-busters above live in THIS file, and this host sends no Cache-Control on
     it, so a browser may reuse an old copy by heuristic freshness - which loads the OLD
     quiz.js/app.js from the old `?v=` numbers and makes a new build look like it was
     never shipped (measured 2026-11-02: a new mode existed on the server and in a fresh
     browser, and not in the one that had visited before).
     So the page asks for its own HTML with `no-store` once, reads the newest `app.js?v=`
     out of it, and reloads ONCE if it disagrees with the one it loaded. A stale HTML
     cannot carry this script, so the very first load after a fix still needs a hard
     reload - after that, this makes it impossible. sessionStorage guards the loop: one
     reload per version, never a refresh storm, and a failed fetch (file://, an offline
     moment, the CrazyGames iframe) is silently ignored. -->
<script>
(function () {
  var here = document.currentScript && document.currentScript.previousElementSibling;
  var cur = '';
  var tags = document.getElementsByTagName('script');
  for (var i = 0; i < tags.length; i++) {
    var m0 = /app\.js\?v=(\d+)/.exec(tags[i].getAttribute('src') || '');
    if (m0) cur = m0[1];
  }
  if (!cur || !window.fetch || !window.sessionStorage) return;
  fetch('index.html?probe=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : ''; })
    .then(function (t) {
      var m = /app\.js\?v=(\d+)/.exec(t || '');
      if (!m || m[1] === cur) return;
      try {
        if (sessionStorage.getItem('kwizzy.reloaded') === m[1]) return;
        sessionStorage.setItem('kwizzy.reloaded', m[1]);
      } catch (e) { return; }            /* no storage: reloading would loop */
      location.reload();
    })
    .catch(function () {});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e141b">
<title>Map viewer — Natural Earth admin-0</title>
<link rel="stylesheet" href="flags.css?v=1">
<link rel="stylesheet" href="style.css?v=23">
</head>
<body>
<div id="stage"><canvas id="map"></canvas></div>
<!-- the scrim closes the menu on a tap anywhere outside it: on a phone there is
     no Esc key and no guaranteed click outside the panel -->
<div id="scrim"></div>
<div id="menu" class="menu"><div id="burger" class="burger" role="button" tabindex="0" aria-label="Pick a view">&#9776;<span class="tag">view</span></div><div id="items" class="items"></div></div>
<div id="panel" class="panel"></div>
<!-- right-click / long-press menu for the geographic point under the cursor -->
<div id="spot" class="spot"></div>
<div id="hud" class="hud"></div>
<div id="help" class="help"></div>
<script src="core.js?v=40"></script>
<script src="app.js?v=76"></script>
</body>
</html>
